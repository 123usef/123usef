<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hey, Joonguini is here! Yousif Mohamed Ibrahim: Senior Full-Stack Developer, Technical Lead, AI-Augmented Development Instructor" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .l{opacity:0}
    .l1{animation:v1 12s linear infinite}
    .l2{animation:v2 12s linear infinite}
    .l3{animation:v3 12s linear infinite}
    .l4{animation:v4 12s linear infinite}
    @keyframes v1{0%,24.9%{opacity:1}25%,100%{opacity:0}}
    @keyframes v2{0%,24.9%{opacity:0}25%,49.9%{opacity:1}50%,100%{opacity:0}}
    @keyframes v3{0%,49.9%{opacity:0}50%,74.9%{opacity:1}75%,100%{opacity:0}}
    @keyframes v4{0%,74.9%{opacity:0}75%,99.9%{opacity:1}100%{opacity:0}}
    .cover{animation:type 12s steps(26,end) infinite}
    @keyframes type{
      0%{transform:translateX(0)}9%{transform:translateX(427px)}21%{transform:translateX(427px)}25%{transform:translateX(0)}
      34%{transform:translateX(365px)}46%{transform:translateX(365px)}50%{transform:translateX(0)}
      59%{transform:translateX(552px)}71%{transform:translateX(552px)}75%{transform:translateX(0)}
      84%{transform:translateX(412px)}96%{transform:translateX(412px)}100%{transform:translateX(0)}
    }
    .cur{animation:blink 1s steps(1,end) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .s{opacity:0;animation:steam 3.6s ease-in-out infinite}
    .s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
    @keyframes steam{0%{opacity:0;transform:translateY(10px)}35%{opacity:.9}100%{opacity:0;transform:translateY(-22px)}}
    .lid{animation:lid 3.6s ease-in-out infinite;transform-origin:1000px 170px}
    @keyframes lid{0%,100%{transform:rotate(0)}48%{transform:rotate(0)}52%{transform:rotate(-2.5deg)}56%{transform:rotate(1.5deg)}60%{transform:rotate(0)}}
    .wave{animation:wave 2.4s ease-in-out infinite;transform-origin:668px 132px}
    @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
  </style>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="10" height="318" rx="5" fill="#f0a04b" opacity="0"/>

  <text x="72" y="78" class="mono" font-size="19" fill="#8b949e">// welcome to the kitchen, neeerds</text>
  <text x="72" y="142" class="sans" font-size="54" font-weight="700" fill="#e6edf3">Hey, <tspan fill="#f0a04b">Joonguini</tspan> is here!</text>
  <text x="72" y="188" class="sans" font-size="24" fill="#c9d1d9">I'm Yousif Mohamed Ibrahim. I cook software and teach the recipes.</text>

  <text x="72" y="254" class="mono" font-size="26" font-weight="700" fill="#3fc1a5">&gt;</text>
  <text x="104" y="254" class="mono l l1" font-size="26" fill="#e6edf3" textLength="421" lengthAdjust="spacingAndGlyphs">Senior Full-Stack Developer</text>
  <text x="104" y="254" class="mono l l2" font-size="26" fill="#e6edf3" textLength="359" lengthAdjust="spacingAndGlyphs">Technical Lead @ NURSEL</text>
  <text x="104" y="254" class="mono l l3" font-size="26" fill="#e6edf3" textLength="546" lengthAdjust="spacingAndGlyphs">AI-Augmented Development Instructor</text>
  <text x="104" y="254" class="mono l l4" font-size="26" fill="#e6edf3" textLength="406" lengthAdjust="spacingAndGlyphs">Programming in the Kitchen</text>
  <g class="cover">
    <rect x="104" y="226" width="640" height="40" fill="#161b22"/>
    <rect class="cur" x="106" y="230" width="4" height="30" fill="#f0a04b"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="s" d="M960 128c-12-12 12-22 0-36" stroke="#8b949e" stroke-width="5"/>
    <path class="s s2" d="M1000 120c-12-12 12-22 0-36" stroke="#8b949e" stroke-width="5"/>
    <path class="s s3" d="M1040 128c-12-12 12-22 0-36" stroke="#8b949e" stroke-width="5"/>
    <g class="lid">
      <path d="M912 170h176" stroke="#f0a04b" stroke-width="8"/>
      <path d="M984 156h32" stroke="#f0a04b" stroke-width="8"/>
    </g>
    <path d="M922 186h156v54a26 26 0 0 1-26 26H948a26 26 0 0 1-26-26z" stroke="#e6edf3" stroke-width="6" fill="#0d1117"/>
    <path d="M922 204h-18a12 12 0 0 0 0 24h18M1078 204h18a12 12 0 0 1 0 24h-18" stroke="#e6edf3" stroke-width="6"/>
